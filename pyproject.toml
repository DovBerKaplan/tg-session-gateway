[project]
name = "tg-session-gateway"
version = "0.0.2"
description = "Long-lived Telegram Bot API session gateway — deploy your bot without dropping the session"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "UP031", "RUF059", "F841"]  # S110: try-except-pass is intentional in cleanup; UP031: % format is fine; RUF059/F841: test unpacking

[tool.mypy]
python_version = "3.12"
# aiosqlite/pyrogram ship no stubs; the gateway itself is fully typed
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
