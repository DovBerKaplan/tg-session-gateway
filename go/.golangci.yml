version: "2"

linters:
  default: standard
  enable:
    - misspell
    - copyloopvar
  settings:
    errcheck:
      # deferred Close on read paths is conventional to ignore; real
      # write paths still must handle errors (checked in review)
      exclude-functions:
        - (io.Closer).Close
        - (database/sql.Rows).Close
        - (database/sql.Stmt).Close
        - (database/sql.Tx).Rollback

formatters:
  enable:
    - gofmt
