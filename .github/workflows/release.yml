name: Release

# Publishes both images to GHCR on version tags (v*).
# Uses only the built-in GITHUB_TOKEN — no PATs, no custom action code.
# Deliberately minimal: this repository has a history of a malicious
# workflow exfiltrating secrets, so every action here is official
# (actions/*, docker/*) and every permission is least-privilege.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.gateway
            image: ${{ github.repository }}        # ghcr.io/<owner>/<repo>
          - dockerfile: docker/Dockerfile.mtgateway
            image: ${{ github.repository }}-mtproto  # ghcr.io/<owner>/<repo>-mtproto
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # v1.2.3 → 1.2.3, 1.2, 1, latest; manual runs → sha + edge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
