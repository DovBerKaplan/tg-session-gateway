name: Release

# Publishes both images to GHCR on version tags (v*), mirroring them to
# Docker Hub (shorter pull command). GHCR stays the source of truth;
# the mirror is a copy with identical tags. Uses only the built-in
# GITHUB_TOKEN for GHCR; the Docker Hub mirror additionally needs the
# repo secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN and is skipped
# entirely when they are absent. This repository has a history of a
# malicious workflow exfiltrating secrets, so every action here is
# official (actions/*, docker/*) and every permission is least-privilege.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets cannot be referenced from step-level `if` (workflow fails
    # validation) — collapse them into one job-level env flag instead
    env:
      DOCKERHUB_MIRROR: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.gateway
            image: ${{ github.repository }}        # ghcr.io/<owner>/<repo>
            mirror: dovberkaplan/tg-session-gateway
          - dockerfile: docker/Dockerfile.mtgateway
            image: ${{ github.repository }}-mtproto  # ghcr.io/<owner>/<repo>-mtproto
            mirror: dovberkaplan/tg-session-gateway-mtproto
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Log in to Docker Hub (mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # v1.2.3 → 1.2.3, 1.2, 1; latest moves ONLY on stable tags —
          # never on pre-releases (v1.2.3-rc1) or manual runs (sha/edge)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Docker Hub mirror — same tags, short pull command ──────────
      # Skipped (not failed) when the repo has no Docker Hub secrets.
      - name: Extract metadata (Docker Hub mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        id: meta-mirror
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.mirror }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push (Docker Hub mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-mirror.outputs.tags }}
          labels: ${{ steps.meta-mirror.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
