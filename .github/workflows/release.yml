name: Release

# Publishes the tggw image to GHCR on version tags (v*), mirroring to
# Docker Hub when the repo secrets exist. Publishing NEEDS the verify
# job first (build + vet + race tests + black-box conformance) —
# nothing ships from a red build.
#
# Security posture: this repository has a history of a malicious
# workflow exfiltrating secrets. Every action here is official
# (actions/*, docker/*); the GitHub Release is created with the
# preinstalled gh CLI (official GitHub tooling) instead of a
# third-party release action, and every permission is least-privilege.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  packages: write # GHCR
  id-token: write # provenance attestations

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pytest
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Black-box conformance against the real binary
        run: |
          CGO_ENABLED=0 go build -o /tmp/tggw ./cmd/tggw
          TGGW_BIN=/tmp/tggw pytest -q tests/conformance_go

  publish:
    name: Build & Publish Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_MIRROR: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # ONE build for both registries: metadata-action tags every
      # listed image identically (the old workflow built twice).
      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # v1.2.3 → 1.2.3, 1.2, 1 — matching the chart's appVersion
          # default; latest moves ONLY on stable tags, never rc/manual
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Extract metadata (Docker Hub mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        id: meta-mirror
        uses: docker/metadata-action@v5
        with:
          images: dovberkaplan/tggw
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Log in to Docker Hub (mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Assemble tag list (GHCR + optional mirror, one build)
        id: tags
        run: |
          {
            echo 'tags<<TAGS_EOF'
            echo "${{ steps.meta.outputs.tags }}"
            if [ -n "${{ steps.meta-mirror.outputs.tags }}" ]; then
              echo "${{ steps.meta-mirror.outputs.tags }}"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (tggw — one build, GHCR + mirror)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tggw
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sync Docker Hub description
        if: env.DOCKERHUB_MIRROR == 'true'
        run: |
          JWT=$(curl -sS -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          jq -Rs '{full_description: .}' README.md | curl -sS -X PATCH \
            "https://hub.docker.com/v2/repositories/dovberkaplan/tggw/" \
            -H "Authorization: JWT ${JWT}" \
            -H 'Content-Type: application/json' \
            -d @-

  release:
    name: GitHub Release (binaries + chart)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Build tggw (${{ matrix.goos }}/${{ matrix.goarch }}) + package chart
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath \
            -ldflags="-s -w -X github.com/DovBerKaplan/tg-session-gateway/internal/version.Version=${{ github.ref_name }}" \
            -o /out/tggw ./cmd/tggw
          cd ..
          sha256sum /out/tggw > /out/tggw-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          mv /out/tggw /out/tggw-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Create GitHub Release (gh CLI — official tooling)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          helm package deploy/helm/tggw -d /out
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" --generate-notes \
            /out/tggw-* /out/*.tgz || true
      - name: Upload ${{ matrix.goos }}/${{ matrix.goarch }} assets
        if: ! (matrix.goos == 'linux' && matrix.goarch == 'amd64')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" /out/tggw-* --clobber

  sign:
    name: Sign (cosign keyless) + publish chart OCI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      id-token: write # keyless signing ONLY in this job
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign + helm (official binaries via curl — no third-party actions in this repo)
        run: |
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign && sudo mv cosign /usr/local/bin/
          curl -sSfL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/
      - name: Sign the image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DOCKERHUB_MIRROR: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$IMAGE@$DIGEST"
          if [ "$DOCKERHUB_MIRROR" = "true" ]; then
            cosign sign --yes "docker.io/dovberkaplan/tggw@$DIGEST"
          fi
      - name: Sign checksums.txt (detached blob signature)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern "*.sha256" --dir /tmp/rel
          cat /tmp/rel/*.sha256 | sort > /tmp/checksums.txt
          gh release upload "${{ github.ref_name }}" /tmp/checksums.txt --clobber
          cosign sign-blob --yes /tmp/checksums.txt --output-signature /tmp/checksums.txt.sig --output-certificate /tmp/checksums.txt.pem
          gh release upload "${{ github.ref_name }}" /tmp/checksums.txt.sig /tmp/checksums.txt.pem --clobber
      - name: Push Helm chart to OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/tggw -d /tmp/chart
          helm push /tmp/chart/*.tgz oci://ghcr.io/dovberkaplan/charts
