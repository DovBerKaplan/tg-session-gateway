name: Release

# Publishes the tggw image to GHCR on version tags (v*), mirroring to
# Docker Hub when the repo secrets exist. Publishing NEEDS the verify
# job first (build + vet + race tests + black-box conformance) —
# nothing ships from a red build.
#
# Security posture: this repository has a history of a malicious
# workflow exfiltrating secrets. Every action here is official
# (actions/*, docker/*); the GitHub Release is created with the
# preinstalled gh CLI (official GitHub tooling) instead of a
# third-party release action, and every permission is least-privilege.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  packages: write # GHCR
  id-token: write # provenance attestations

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pytest aiosqlite cryptography
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Black-box conformance against the real binary
        run: |
          CGO_ENABLED=0 go build -o /tmp/tggw ./cmd/tggw
          TGGW_BIN=/tmp/tggw pytest -q tests/conformance_go

  publish:
    name: Build & Publish Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_MIRROR: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # ONE build for both registries: metadata-action tags every
      # listed image identically (the old workflow built twice).
      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # v1.2.3 → 1.2.3, 1.2, 1 — matching the chart's appVersion
          # default; latest moves ONLY on stable tags, never rc/manual
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Extract metadata (Docker Hub mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        id: meta-mirror
        uses: docker/metadata-action@v5
        with:
          images: dovberkaplan/tggw
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Log in to Docker Hub (mirror)
        if: env.DOCKERHUB_MIRROR == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Assemble tag list (GHCR + optional mirror, one build)
        id: tags
        run: |
          {
            echo 'tags<<TAGS_EOF'
            echo "${{ steps.meta.outputs.tags }}"
            if [ -n "${{ steps.meta-mirror.outputs.tags }}" ]; then
              echo "${{ steps.meta-mirror.outputs.tags }}"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (tggw — one build, GHCR + mirror)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tggw
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sync Docker Hub description
        if: env.DOCKERHUB_MIRROR == 'true'
        run: |
          JWT=$(curl -sS -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          jq -Rs '{full_description: .}' README.md | curl -sS -X PATCH \
            "https://hub.docker.com/v2/repositories/dovberkaplan/tggw/" \
            -H "Authorization: JWT ${JWT}" \
            -H 'Content-Type: application/json' \
            -d @-

  release:
    name: "GitHub Release (GoReleaser: binaries, checksums, SBOMs)"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write # cosign keyless signing of the chart blob
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads the tag history for the changelog
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # every binary PINNED and checksum-verified (supply-chain posture:
      # no unpinned network installs in the release path)
      - name: Install build tools (pinned + checksum-verified)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.55.0
          curl -sSfL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tgz" | sha256sum -c -
          tar xz < /tmp/helm.tgz -C /tmp && sudo mv /tmp/linux-amd64/helm /usr/local/bin/
          curl -sSfL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign
      # the chart is packaged OUTSIDE dist/ (goreleaser --clean wipes it)
      # and rides the release via extra_files (.goreleaser.yaml)
      - name: Package the Helm chart
        run: helm package deploy/helm/tggw -d .chart-out
      - name: Sign the chart (keyless, bundle beside the tgz)
        run: |
          /tmp/cosign sign-blob --yes \
            --bundle .chart-out/chart.tgz.bundle \
            .chart-out/tggw-*.tgz
      # THE one third-party action in this repo (user-directed), SHA-pinned
      # (v6 = e435ccd777264be153ace6237001ef4d979d3a7a): builds all six
      # platform binaries + checksums + SBOMs and creates the GitHub
      # Release in one auditable step. Everything else here stays on
      # official binaries via curl.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.12.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign:
    name: Sign (cosign keyless) + publish chart OCI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # upload signatures to the release
      packages: write # push the chart to OCI GHCR
      id-token: write # keyless signing ONLY in this job
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign + helm (pinned + checksum-verified)
        run: |
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/
          curl -sSfL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          echo "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179  /tmp/helm.tgz" | sha256sum -c -
          tar xz < /tmp/helm.tgz -C /tmp && sudo mv /tmp/linux-amd64/helm /usr/local/bin/
      - name: Sign the image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DOCKERHUB_MIRROR: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$IMAGE@$DIGEST"
          if [ "$DOCKERHUB_MIRROR" = "true" ]; then
            cosign sign --yes "docker.io/dovberkaplan/tggw@$DIGEST"
          fi
      - name: Sign checksums.txt (detached blob signature)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # goreleaser already generated + uploaded checksums.txt
          gh release download "${{ github.ref_name }}" --pattern "checksums.txt" --dir /tmp/rel
          cosign sign-blob --yes /tmp/rel/checksums.txt \
            --output-signature /tmp/checksums.txt.sig \
            --output-certificate /tmp/checksums.txt.pem
          gh release upload "${{ github.ref_name }}" /tmp/checksums.txt.sig /tmp/checksums.txt.pem --clobber
      - name: Push the signed Helm chart to OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/tggw -d /tmp/chart
          helm push /tmp/chart/*.tgz oci://ghcr.io/dovberkaplan/charts
          # keyless verification bundle for the OCI-pushed chart
          cosign sign-blob --yes --bundle /tmp/chart/chart-oci.bundle /tmp/chart/*.tgz
          gh release upload "${{ github.ref_name }}" /tmp/chart/chart-oci.bundle --clobber
