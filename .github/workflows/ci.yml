name: CI

on:
  push: {branches: [main]}
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check gateway/ mtgateway/ tests/ --output-format=github
      - run: ruff format --check gateway/ mtgateway/ tests/

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install mypy -r requirements.txt -r mtgateway/requirements.txt
      - run: mypy gateway/ mtgateway/

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt -r mtgateway/requirements.txt
      - run: pytest -q --cov=gateway --cov=mtgateway --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.gateway -t tg-session-gateway:ci .
      - run: docker build -f docker/Dockerfile.mtgateway -t tg-mtgateway:ci .

  go-test:
    name: Go Tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod}
      - run: go build ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test -race -count=1 ./...
        working-directory: go

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod}
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: go
          args: --timeout=5m

  go-conformance:
    name: Go Black-box Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pytest
      - name: Build static binary
        run: cd go && CGO_ENABLED=0 go build -o /tmp/tggw ./cmd/tggw
      - name: Run conformance suite against the real binary
        run: pytest -q tests/conformance_go
        env: {TGGW_BIN: /tmp/tggw}

  go-image:
    name: Go Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.tggw -t tggw:ci .
      - run: docker run --rm tggw:ci version
      - run: docker run --rm --entrypoint /tggw tggw:ci healthcheck http://127.0.0.1:1 && exit 1 || exit 0

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r mtgateway/requirements.txt --ignore CV-001
