name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    # weekly real-Telegram E2E (e2e-botapi) against main — the soak canary
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # the store's cross-compat tests shell out to python with aiosqlite
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install aiosqlite cryptography
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0 # built with go1.26 — matches go.mod
          args: --timeout=5m

  go-coverage:
    name: Coverage (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install aiosqlite cryptography
      - run: go test -count=1 -coverprofile=/tmp/cover.out ./...
      - name: Per-package table + ratchet gate
        run: |
          python3 scripts/coverage-gate.py /tmp/cover.out
      - name: HTML report artifact
        if: always()
        run: go tool cover -html=/tmp/cover.out -o coverage.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage.html

  e2e-botapi:
    name: E2E (real Telegram, Bot API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # secrets are unavailable on fork PRs; the script skips loudly
    # when they are absent so first-time contributors stay green
    env:
      TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
      TG_TEST_CHAT_ID: ${{ secrets.TG_TEST_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: tests/conformance_go/e2e_botapi.sh

  go-conformance:
    name: Go Black-box Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pytest
      - name: Build static binary
        run: CGO_ENABLED=0 go build -o /tmp/tggw ./cmd/tggw
      - name: Run conformance suite against the real binary
        run: pytest -q tests/conformance_go
        env: {TGGW_BIN: /tmp/tggw}

  go-vuln:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: ~/go/bin/govulncheck ./...

  go-image:
    name: Go Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.tggw -t tggw:ci .
      - run: docker run --rm tggw:ci version
      - run: docker run --rm --entrypoint /tggw tggw:ci healthcheck http://127.0.0.1:1 && exit 1 || exit 0

  go-kind:
    name: Go K8s Acceptance (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Install helm + kind + kubectl
        run: |
          curl -sSfL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/
          curl -sSfL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.25.0/kind-linux-amd64
          sudo install kind /usr/local/bin/
          curl -sSfL -o kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
          sudo install kubectl /usr/local/bin/
      - name: Build image
        run: docker build -f docker/Dockerfile.tggw -t tggw:verify .
      - name: Run kind acceptance (chart install, traffic, pod-kill, NetworkPolicy)
        run: deploy/helm/verify-kind.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # main is Go-only; the only python surface left is the black-box
      # conformance tooling (httpx+pytest) and the launch scripts
      - run: pip install pip-audit pyyaml
      - run: pip-audit --skip-editable
      - name: OpenAPI spec parses
        run: python3 -c "import yaml; yaml.safe_load(open('docs/openapi.yaml')); print('openapi OK')"
