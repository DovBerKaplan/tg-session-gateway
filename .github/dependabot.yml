version: 2
updates:
  # Go modules — the product itself
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  # docker/Dockerfile.tggw builder pin
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
  # action tags (SHA pins stay manual policy; dependabot flags staleness)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
