# The gateway's OWN lifecycle — never referenced from a consumer compose.
# Spec §5: separate project name, external network, dedicated volume.
# Start once with deploy/install.sh; consumers only JOIN the network.
name: tg-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: tg-session-gateway:latest
    container_name: tg-gateway
    labels:
      tg.gateway: "true"
      autoheal: "true"           # docker-autoheal restarts unhealthy (docker itself never does)
    restart: unless-stopped
    stop_grace_period: 30s       # drain in-flight + flush offsets + release locks
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      GW_ADMIN_SECRET: ${GW_ADMIN_SECRET:?set in .env}
      GW_APP_SECRET: ${GW_APP_SECRET:?set in .env}
      GW_FERNET_KEY: ${GW_FERNET_KEY:?set in .env}
      GW_ON_LIMIT: ${GW_ON_LIMIT:-queue}
    volumes:
      - tg-gateway-data:/data
    networks:
      - tg-gateway-net
    ports:
      - "127.0.0.1:8080:8080"   # admin/API on loopback only (spec §5.1)

networks:
  tg-gateway-net:
    name: tg-gateway-net
    external: true              # created once by install.sh

volumes:
  tg-gateway-data:
    name: tg-gateway-data
