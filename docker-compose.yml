# The Go binary (tggw) — same lifecycle contract as docker-compose.yml,
# one image for both planes. Non-K8s users are unaffected by the Go
# rewrite: the GW_* env contract and /data layout are identical.
name: tg-gateway-go

services:
  botapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.tggw
    image: tggw:latest
    container_name: tg-gateway-botapi
    command: ["botapi"]
    labels:
      tg.gateway: "true"
      autoheal: "true"
    restart: unless-stopped
    stop_grace_period: 30s # drain in-flight + flush offsets + release locks
    healthcheck:
      test: ["CMD", "/tggw", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      GW_ADMIN_SECRET: ${GW_ADMIN_SECRET:?set in .env}
      GW_APP_SECRET: ${GW_APP_SECRET:?set in .env}
      GW_FERNET_KEY: ${GW_FERNET_KEY:?set in .env}
      GW_ON_LIMIT: ${GW_ON_LIMIT:-queue}
      # Local Bot API companion (profile local-botapi): cloud primary + internal fallback.
      # Set GW_ENV_DETECT=auto to let the gateway recommend failover on TLS failure.
      GW_UPSTREAM: ${GW_UPSTREAM:-https://api.telegram.org}
      GW_UPSTREAM_FALLBACK: ${GW_UPSTREAM_FALLBACK:-}
      GW_UPSTREAM_FAILOVER: ${GW_UPSTREAM_FAILOVER:-off}
      GW_UPSTREAM_KIND: ${GW_UPSTREAM_KIND:-auto}
      GW_ENV_DETECT: ${GW_ENV_DETECT:-off}
      GW_UPSTREAM_CA_FILE: ${GW_UPSTREAM_CA_FILE:-}
      GW_PATH_PREFIX: ${GW_PATH_PREFIX:-/tgapi}
    volumes:
      - tg-gateway-data:/data
      # Shared with telegram-bot-api when using --local absolute file paths (optional).
      - tg-local-botapi-data:/var/lib/telegram-bot-api:ro
    networks:
      - tg-gateway-net
    ports:
      - "127.0.0.1:8080:8080" # admin/API on loopback only (spec §5.1)

  # Local Bot API companion (tdlib/telegram-bot-api). Opt-in:
  #   docker compose --profile local-botapi up -d
  # Clients still talk only to tggw (/tgapi). Never expose this port publicly.
  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    container_name: tg-gateway-telegram-bot-api
    profiles: ["local-botapi"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-${GW_API_ID:-}}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-${GW_API_HASH:-}}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-local-botapi-data:/var/lib/telegram-bot-api
    networks:
      - tg-gateway-net
    # internal only — no host ports

  mtproto:
    image: tggw:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.tggw
    container_name: tg-gateway-mtproto
    command: ["mtproto"]
    profiles: ["mtproto"] # opt-in, like the Helm values
    labels:
      tg.gateway: "true"
      autoheal: "true"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/tggw", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      GW_ADMIN_SECRET: ${GW_ADMIN_SECRET:?set in .env}
      GW_APP_SECRET: ${GW_APP_SECRET:?set in .env}
      GW_FERNET_KEY: ${GW_FERNET_KEY:?set in .env}
      GW_API_ID: ${GW_API_ID:?set in .env}
      GW_API_HASH: ${GW_API_HASH:?set in .env}
    volumes:
      - tg-gateway-mt-data:/data
    networks:
      - tg-gateway-net
    ports:
      - "127.0.0.1:8081:8080"

networks:
  tg-gateway-net:
    name: tg-gateway-net
    external: true # created once by deploy/install.sh; consumers JOIN it

volumes:
  tg-gateway-data:
    name: tg-gateway-data
  tg-gateway-mt-data:
    name: tg-gateway-mt-data
  tg-local-botapi-data:
    name: tg-local-botapi-data
