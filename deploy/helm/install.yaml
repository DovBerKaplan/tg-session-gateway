# Source: tggw/templates/botapi-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tggw-botapi
  namespace: tg-gateway
  labels:
    app.kubernetes.io/name: tggw
    app.kubernetes.io/instance: tggw
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: tggw-0.1.0
    app.kubernetes.io/component: botapi
    tggw/component: botapi
spec:
  # replicas is pinned to 1 by product invariant: a second live replica
  # sharing bot tokens is a split-brain poller, not availability.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tggw
      app.kubernetes.io/instance: tggw
      tggw/component: botapi
  serviceName: tggw-botapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tggw
        app.kubernetes.io/instance: tggw
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: tggw-0.1.0
        app.kubernetes.io/component: botapi
        tggw/component: botapi
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: botapi
          image: ghcr.io/dovberkaplan/tg-session-gateway-go:0.1.0-go
          imagePullPolicy: IfNotPresent
          args: ["botapi"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GW_DATA_DIR
              value: /data
            - name: GW_HOST
              value: 0.0.0.0
            - name: GW_PORT
              value: "8080"
            - name: GW_ON_LIMIT
              value: "queue"
            - name: GW_UPSTREAM
              value: "https://api.telegram.org"
          envFrom:
            - secretRef:
                name: tggw-secrets
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOncePod"]
        resources:
          requests:
            storage: 1Gi
---
