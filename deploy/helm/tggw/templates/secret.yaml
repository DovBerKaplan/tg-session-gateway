{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tggw.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tggw.labels" . | nindent 4 }}
  annotations:
    # helm-resource-policy would also work; keep it explicit instead:
    # this Secret must survive `helm uninstall` mistakes during ops.
    description: "tggw secrets — GW_FERNET_KEY rotation loses stored tokens"
type: Opaque
data:
  GW_ADMIN_SECRET: {{ include "tggw.adminSecret" . }}
  GW_APP_SECRET: {{ include "tggw.appSecret" . }}
  {{- if .Values.secrets.fernetKey }}
  GW_FERNET_KEY: {{ .Values.secrets.fernetKey | b64enc }}
  {{- else }}
  {{- fail "secrets.fernetKey is required (create with `tggw genkey` or openssl rand -base64 32 | tr '+/' '-_') — the gateway refuses to generate it inside the cluster because a rotated key makes every stored token undecryptable" }}
  {{- end }}
  {{- if .Values.mtproto.enabled }}
  GW_API_ID: {{ .Values.secrets.apiID | int | toString | b64enc }}
  GW_API_HASH: {{ .Values.secrets.apiHash | b64enc }}
  {{- end }}
{{- end }}
