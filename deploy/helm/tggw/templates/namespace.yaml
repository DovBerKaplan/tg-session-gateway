{{- if and .Values.createNamespace (ne .Release.Namespace .Values.namespace) }}
{{- fail (printf "Release namespace (%s) must equal values.namespace (%s) — the quota/networkpolicy scope assumes one dedicated namespace" .Release.Namespace .Values.namespace) }}
{{- end }}
{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
